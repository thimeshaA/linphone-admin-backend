# NOTE: This file is written to eventually live at
# /srv/admin-panel-project/docker-compose.yml, one level ABOVE the backend/
# folder. All paths below are written for that final location.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admin-panel-backend-new
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:8083:4000"
    restart: unless-stopped
    networks:
      - admin-panel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admin-panel-frontend-new
    env_file:
      - ./frontend/.env
    ports:
      - "127.0.0.1:8084:3000"
    restart: unless-stopped
    networks:
      - admin-panel-net

networks:
  admin-panel-net:
    driver: bridge
