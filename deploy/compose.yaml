# Local dev with `podman compose`. Run from this folder:
#   cd deploy && NEXT_PUBLIC_SIP_DOMAIN=<sip-domain> podman compose up --build
#
# Paths are relative to THIS file (deploy/). Assumes the backend and frontend
# repos are sibling folders:
#   <parent>/linphone-admin-backend/deploy/compose.yaml   <- this file
#   <parent>/linphone-admin-frontend/                     <- FRONTEND_DIR
# If the frontend folder is named differently (e.g. the old
# /srv/admin-panel-project/{backend,frontend} layout), set
# FRONTEND_DIR=../../frontend.
#
# Env files are NOT committed: the backend reads ../.env (see .env.example),
# the frontend reads <FRONTEND_DIR>/.env.
#
# Production does not use this file - see deploy/quadlet/.

services:
  backend:
    build:
      context: ..
      dockerfile: Containerfile
    container_name: admin-backend
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:8083:4000"
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
    networks:
      - admin-panel-net
    dns:
      - 8.8.8.8
      - 10.8.1.1
    # /health (see index.js) checks both DB pools, not just that the process
    # is up. Compose only reports unhealthy here; auto-restart on failed
    # healthchecks is handled in production by Quadlet's HealthOnFailure=.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ${FRONTEND_DIR:-../../linphone-admin-frontend}
      dockerfile: Containerfile
      args:
        # Inlined into the client bundle at build time - changing it needs a rebuild.
        NEXT_PUBLIC_SIP_DOMAIN: ${NEXT_PUBLIC_SIP_DOMAIN}
    container_name: admin-frontend
    env_file:
      - ${FRONTEND_DIR:-../../linphone-admin-frontend}/.env
    environment:
      # Backend by container name on the shared network (container port, not 8083).
      - BACKEND_URL=http://admin-backend:4000
    ports:
      - "127.0.0.1:8084:3000"
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - admin-panel-net
    dns:
      - 8.8.8.8
      - 10.8.1.1
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  admin-panel-net:
    driver: bridge
