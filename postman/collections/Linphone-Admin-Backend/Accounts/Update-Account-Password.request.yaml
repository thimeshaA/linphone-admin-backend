$kind: http-request
name: Update Account Password
method: PATCH
url: '{{baseUrl}}/api/accounts/{{accountId}}/password'
order: 1004
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "password": "newPassword123"
    }
description: |-
  ## Purpose
  Resets the SIP password for an existing account without deleting or recreating it. Uses the same `MD5(authid:domain:password)` hashing scheme as account creation.

  ## Use Case
  Called when a customer needs their SIP credentials reset — for example, after a security incident or when they've forgotten their password.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - Both admins and resellers can update passwords.
  - **Resellers** can only update passwords for accounts they own; requesting another reseller's account returns **404**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **URL param:** `:id` — the numeric id of the SIP account.
  - **Required body field:**
    - `password` (string) — new plaintext password; hashed server-side as `MD5(authid:domain:password)`.

  ## Responses
  - **200 OK** — password updated successfully. Response contains only a success message — the new hash is never returned.
  - **404 Not Found** — account does not exist, or reseller does not own it.
  - **401 Unauthorized** — missing or invalid auth token.

  ## Notes
  The hashing logic is shared with the Create Account endpoint — it is not duplicated. The plaintext password and the resulting hash are never returned in any response.