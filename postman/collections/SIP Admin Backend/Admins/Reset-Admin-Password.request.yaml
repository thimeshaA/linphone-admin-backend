$kind: http-request
name: Reset Admin Password
method: PATCH
url: '{{baseUrl}}/api/admins/2/reset-password'
order: 2004
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "newPassword": "newsecurepassword"
    }
description: |-
  ## Purpose
  Sets a new password for a reseller account. Used when a reseller has lost access and cannot use the self-service Change Password flow.

  ## Use Case
  Called by the admin when a reseller contacts support because they've forgotten their password and need it reset without knowing the current one.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admin-only** - resellers receive **403 Forbidden**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **URL param:** `:id` - the numeric id of the reseller whose password is being reset.
  - **Required body field:**
    - `newPassword` (string) - new plaintext password; hashed server-side with bcrypt.

  ## Responses
  - **200 OK** - password reset successfully. Returns only a success confirmation - the hash is never returned.
  - **404 Not Found** - no reseller with that id exists.
  - **403 Forbidden** - caller is a reseller.
  - **401 Unauthorized** - missing or invalid auth token.

  ## Notes
  This endpoint does not require the reseller's current password - it is an admin override. For self-service password changes (where the current password must be confirmed), use the Auth → Change Password endpoint instead.