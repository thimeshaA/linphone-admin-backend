$kind: http-request
name: Reset Admin Password
method: PATCH
url: '{{baseUrl}}/api/admins/2/reset-password'
order: 2004
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "the-acting-admins-own-current-password",
      "newPassword": "newsecurepassword"
    }
description: |-
  ## Purpose
  Sets a new password for a reseller account. Used when a reseller has lost access and cannot use the self-service Change Password flow.

  ## Use Case
  Called by the admin when a reseller contacts support because they've forgotten their password and need it reset without knowing the current one.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admin-only** - resellers receive **403 Forbidden**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.
  - **Step-up auth:** the acting admin must also re-confirm their own current password via `currentPassword` (see Request Requirements). This is a highly privileged action - it must not be reachable on a hijacked session cookie alone.

  ## Request Requirements
  - **URL param:** `:id` - the numeric id of the reseller whose password is being reset.
  - **Required body fields:**
    - `currentPassword` (string) - the **acting admin's own** current password, verified against their own stored hash before the reset proceeds. Not the reseller's password.
    - `newPassword` (string) - new plaintext password for the reseller; hashed server-side with bcrypt. Subject to the same password policy as every other password-setting endpoint: 10-128 characters, rejected if it's on the local common-password blocklist. No forced complexity rules.

  ## Responses
  - **200 OK** - password reset successfully. Returns only a success confirmation - the hash is never returned.
  - **400 Bad Request** - `currentPassword` missing, or `newPassword` fails the password policy.
  - **401 Unauthorized** - `currentPassword` does not match the acting admin's own stored hash, or the auth cookie is missing/invalid/expired.
  - **404 Not Found** - no reseller with that id exists.
  - **403 Forbidden** - caller is a reseller.

  ## Notes
  This does not require the *reseller's* current password - it's an admin override for a forgotten password. It does now require the *admin's own* current password as a step-up-auth check (added as part of the password-security hardening pass), and the reseller is emailed a "your password was changed" notification and the action is written to the backend audit log (actor, target reseller id, action, IP, timestamp). For self-service password changes by a user changing their own password, use the Auth → Change Password endpoint instead.