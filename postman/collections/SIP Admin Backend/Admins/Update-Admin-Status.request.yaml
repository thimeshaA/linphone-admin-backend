$kind: http-request
name: Update Admin Status
method: PATCH
url: '{{baseUrl}}/api/admins/3fa85f64-5717-4562-b3fc-2c963f66afa6'
order: 2003
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "active"
    }
description: |-
  ## Purpose
  Updates a reseller's status, email, and/or company billing profile (address, license detail, phone). Despite the request name, this is the general-purpose reseller edit endpoint - not status-only.

  ## Use Case
  Enabling/disabling access (e.g. for a billing issue), correcting a contact email, or filling in/editing the company details shown on invoice PDFs' "Billed To" block.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admin-only** - resellers receive **403 Forbidden**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **URL param:** `:id` - the UUID of the reseller to update.
  - At least one of the fields below is required; any combination may be sent together in one request.
    - `status` (string) - must be `"active"` or `"disabled"`.
    - `email` (string) - must be a valid, not-already-taken email.
    - `address` (string, or `null` to clear) - company billing address, shown on invoice PDFs.
    - `license_detail` (string, max 255 chars, or `null` to clear) - shown on invoice PDFs as "License: ...".
    - `phone` (string, max 20 chars, or `null` to clear) - company contact phone, shown on invoice PDFs.
  - `username` cannot be changed through this endpoint (or at all, after creation) - sending it is rejected with a field-specific 400.

  ## Responses
  - **200 OK** - reseller updated successfully; response reflects every field changed in this request.
  - **400 Bad Request** - no recognized field provided, `status` is not `"active"`/`"disabled"`, `email` is malformed, `license_detail`/`phone` exceed their max length, or `username` was sent.
  - **404 Not Found** - no reseller with that id exists.
  - **409 Conflict** - `email` is already used by a different admin/reseller.
  - **403 Forbidden** - caller is a reseller.
  - **401 Unauthorized** - missing or invalid auth token.

  ## Notes
  Disabling a reseller prevents login but does not affect the SIP accounts they have already created. The `disabled` status is checked at login time, after password validation.

  `address`/`license_detail`/`phone` are fetched fresh (not snapshotted) every time an invoice PDF is generated - a change here affects *every* invoice for that reseller, including already-sent ones, the next time its PDF is generated or re-downloaded.