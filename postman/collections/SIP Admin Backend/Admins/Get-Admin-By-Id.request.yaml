$kind: http-request
name: Get Admin By Id
method: GET
url: '{{baseUrl}}/api/admins/2'
order: 2001
description: |-
  ## Purpose
  Fetches a single reseller account by its `id` from `auth_admins`.

  ## Use Case
  Used when the admin needs to inspect the details of a specific reseller - for example, before updating their status or resetting their password.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admin-only** - resellers receive **403 Forbidden**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **URL param:** `:id` - the numeric id of the reseller to fetch.
  - No body or query params.

  ## Responses
  - **200 OK** - single reseller object. `password_hash` is never included.
  - **404 Not Found** - no reseller with that id exists.
  - **403 Forbidden** - caller is a reseller.
  - **401 Unauthorized** - missing or invalid auth token.

  ## Notes
  Only reseller-role accounts are accessible through this API. The primary admin account cannot be fetched via this endpoint.