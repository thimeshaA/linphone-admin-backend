$kind: http-request
name: Get Account Report
method: GET
url: '{{baseUrl}}/api/reports/accounts'
order: 1000
params:
  - key: period
    value: monthly
    description: '"monthly" or "annual"'
  - key: month
    value: '2026-08'
    description: 'Required when period=monthly. Format YYYY-MM.'
  - key: year
    value: '2026'
    disabled: true
    description: 'Required when period=annual. Format YYYY.'
description: |-
  ## Purpose
  Generates a PDF report of SIP account activity for a given monthly or annual period: totals, active/disabled/expired counts (as of generation time), accounts created in the period, and accounts renewed in the period.

  ## Use Case
  Handed to admins or resellers as a downloadable business report — e.g. a reseller reviewing their own account activity for the past month, or an admin reviewing platform-wide activity plus a per-reseller breakdown.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admins** get platform-wide stats plus a breakdown table of accounts created per reseller within the period.
  - **Resellers** get stats scoped to only their own accounts (same `applyOwnershipFilter` scoping as `GET /api/accounts`); no per-reseller breakdown.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **Required query params:**
    - `period` — `monthly` or `annual`.
    - `month` — required when `period=monthly`, format `YYYY-MM`.
    - `year` — required when `period=annual`, format `YYYY`.

  ## Responses
  - **200 OK** — `application/pdf` binary body, `Content-Disposition: attachment; filename="account-report-<period>.pdf"`.
  - **400 Bad Request** — `period` missing/invalid, or the matching `month`/`year` param is missing or malformed.
  - **401 Unauthorized** — missing or invalid auth token.

  ## Notes
  "Expired" is computed live from `expires_at` at generation time rather than trusting the stored `status` column, since accounts are never lazily flipped to `expired` outside of this computation.
