$kind: http-request
name: Update Account Password
method: PATCH
url: '{{baseUrl}}/api/accounts/{{accountId}}/password'
order: 1004
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "password": "newPassword123"
    }
description: |-
  ## Purpose
  Resets the SIP password for an existing account without deleting or recreating it. Uses the same `SHA256(authid:flexi1.kryptoline.com:password)` hashing scheme as account creation.

  ## Use Case
  Called when a customer needs their SIP credentials reset - for example, after a security incident or when they've forgotten their password.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - Both admins and resellers can update passwords.
  - **Resellers** can only update passwords for accounts they own; requesting another reseller's account returns **404**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **URL param:** `:id` - the id of the SIP account.
  - **Required body field:**
    - `password` (string) - new plaintext password; hashed server-side as `SHA256(authid:flexi1.kryptoline.com:password)`.

  ## Responses
  - **200 OK** - password updated successfully. Response contains a success message and `qrPayload` (string) - an encrypted QR payload carrying the account's username and new password, for the companion app. The new hash itself is never returned.
  - **404 Not Found** - account does not exist, or reseller does not own it.
  - **401 Unauthorized** - missing or invalid auth token.
  - **500 Internal Server Error** - the QR encryption key is missing or misconfigured; the password is not changed in this case (checked before any DB write).

  ## Notes
  The hashing logic is shared with the Create Account endpoint - it is not duplicated. The hash always uses the fixed realm `flexi1.kryptoline.com`, regardless of whatever domain value the account row already had (legacy rows created under the old MD5 scheme get their `algorithm` column corrected to `SHA-256` the moment their password is next changed here). The plaintext password and the resulting hash are never returned in any response.

  The response's `qrPayload` is a separate, encrypted string meant for the companion iOS app to scan and decrypt locally - it is never included in any email or in any other response. Format: standard (padded) base64 of `nonce[12] || ciphertext || tag[16]`, AES-256-GCM with no additional authenticated data; the plaintext is UTF-8 JSON `{"username": "...", "password": "..."}` (exactly those two string fields, nothing else).