$kind: http-request
name: Renew Account
method: PATCH
url: '{{baseUrl}}/api/accounts/{{accountId}}/renew'
order: 1003
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "expires_at": null
    }
description: |-
  ## Purpose
  Extends the expiry date of an existing SIP account. If the new `expires_at` is in the future, it also resets the account's status to `active` and clears any stale `expired_at` flag.

  ## Use Case
  Called when a customer's SIP account subscription is renewed - either manually by a reseller or triggered by a billing event.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - Both admins and resellers can renew accounts.
  - **Resellers** can only renew accounts they own; requesting another reseller's account returns **404**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **URL param:** `:id` - the UUID of the SIP account to renew.
  - **Optional body field:**
    - `expires_at` (ISO date string) - new expiry date. Defaults to +6 months from now if omitted or `null`.

  ## Responses
  - **200 OK** - account renewed; `expires_at` updated and status reset to `active` if the new date is in the future.
  - **404 Not Found** - account does not exist, or reseller does not own it.
  - **401 Unauthorized** - missing or invalid auth token.

  ## Notes
  - Renewing an account never touches `disabled_at`. Disabling and expiring are treated as two independent states - a renewed account can still be disabled.
  - After a successful renewal, if the account has an owning reseller (`creator_id`), the current renewal cost (see `GET /api/settings/renewal-cost`) is deducted from **that reseller's** wallet as a `renewal_deduction` entry in `wallet_ledger` - regardless of who clicked renew (an admin renewing on a reseller's behalf still charges the reseller, not the admin). Accounts with no owning reseller are skipped entirely; no wallet exists to deduct from.
  - This deduction always happens and the renewal always succeeds, even if it pushes the wallet balance negative - renewals are never blocked for insufficient funds.
  - Once the deduction is recorded, an email is sent to the owning reseller and to every admin (`role = 'admin'`) stating which account was renewed, the amount deducted, and the resulting wallet balance. Email failures are only logged server-side and never affect the response.