$kind: http-request
name: Create Account
method: POST
url: '{{baseUrl}}/api/accounts'
order: 1002
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "authid": "testuser",
      "password": "securepassword",
      "phone": "+15551234567",
      "email": "customer@example.com",
      "expires_at": null,
      "resellerId": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
    }
description: |-
  ## Purpose
  Creates a new SIP account in `auth_users`. The password is hashed server-side using the SIP digest format required by Flexisip. On success, a credentials email is sent to the supplied `email` address.

  ## Use Case
  Called when an admin provisions a new SIP account on behalf of a reseller, explicitly assigning which reseller owns the resulting account.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admin-only** - resellers always receive **403 Forbidden**. Resellers can no longer create accounts directly; they submit a batch request instead (see Request Accounts).
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **Required body fields:**
    - `authid` (string) - SIP username, e.g. `"alice"`. 1-20 characters; letters, digits, `.`, `_`, `-` only (no `@`, no whitespace). Unique across the entire accounts table.
    - `password` (string) - plaintext password; hashed server-side as `SHA256(authid:flexi1.kryptoline.com:password)`.
    - `phone` (string) - contact phone number.
    - `email` (string) - valid contact email; stored on the account and used to send the credentials email below. Not required to be unique - multiple accounts may share the same contact email.
    - `resellerId` (string, UUID) - the id of the `admins` row that will own this account. Must reference an existing row with `role = 'reseller'`; validated the same way for both this endpoint and Reassign Account.
  - **Optional body fields:**
    - `domain` (string) - there is exactly one SIP realm, `flexi1.kryptoline.com`. Omit this field entirely; if sent, it must equal that value exactly or the request is rejected with a 400 (never silently overridden).
    - `expires_at` (ISO date string) - account expiry date; defaults to +6 months from now if omitted.

  ## Responses
  - **201 Created** - account created successfully. Also includes `qrPayload` (string) - an encrypted QR payload carrying the account's username and password, for the companion app; see QR payload notes below.
  - **400 Bad Request** - field-specific validation errors, e.g. `{ "errors": { "authid": "...", "email": "...", "domain": "..." } }`. Also returned as a flat `{ "error": "..." }` when `resellerId` is missing, does not reference an existing reseller, or references a disabled reseller.
  - **403 Forbidden** - caller is a reseller; account creation is admin-only.
  - **409 Conflict** - an account with this `authid` already exists (`{ "error": "An account with this authid already exists" }`).
  - **401 Unauthorized** - missing or invalid auth token.
  - **500 Internal Server Error** - the QR encryption key is missing or misconfigured; nothing is created in this case (checked before any DB write).

  ## Notes
  The password hashing scheme is `SHA256(authid:flexi1.kryptoline.com:password)`, lowercase hex - this matches Flexisip's production hashing exactly (confirmed against production's own Python implementation) and is intentionally different from the bcrypt scheme used for admin/reseller login passwords. The plaintext password is never stored. (This replaced the previous MD5-based scheme; existing rows created under the old scheme are untouched until their password is next changed.)

  The realm (`flexi1.kryptoline.com`) is a fixed backend constant, not something the caller can change - it's always written to `domain` and always used in the hash, so the two can never disagree.

  After the account row is created, the backend emails `authid` and the **plaintext** password (captured before hashing) plus the `ADMIN_PANEL_URL` login link to `email`. If that email fails to send, account creation still succeeds (the DB write is not rolled back) - the failure is only logged server-side, not surfaced in the response. Sending a plaintext password by email is a known-imperfect pattern; a one-time setup-link flow is a possible future improvement.

  The response's `qrPayload` is a separate, encrypted string (AES-256-GCM, `v1.<base64url>` format) meant for a future companion app to scan and decrypt locally - it is never included in the credentials email or in any other response (list/get/etc).

  `resellerId` is currently required on every create - there is no "unassigned" account state. Whether `auth_users.creator_id` allows `NULL` in the live schema has not been confirmed (no migration files exist in this repo and no DB was reachable to inspect it directly), so this endpoint deliberately avoids ever writing a `NULL` creator_id rather than assuming the constraint allows it.