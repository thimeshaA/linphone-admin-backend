$kind: http-request
name: List Invoices
method: GET
url: '{{baseUrl}}/api/invoices'
order: 1004
params:
  - key: resellerId
    value: '2'
    disabled: true
    description: 'Admin-only filter: only invoices for this reseller'
  - key: status
    value: draft
    disabled: true
    description: 'Filter by status: draft | sent | partially_paid | paid'
description: |-
  ## Purpose
  Lists invoices - every invoice for admins, only the caller's own for resellers.

  ## Use Case
  Powers the admin's billing dashboard and the reseller's own "my invoices" view.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admins** see every invoice, optionally filtered by `resellerId`/`status`.
  - **Resellers** only ever see their own invoices - same ownership-scoping pattern as `/api/accounts` and `/api/resellers/:id/wallet`.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **Optional query params:**
    - `?resellerId=` - admin-only filter to one reseller's invoices.
    - `?status=` - filter to one of `draft` | `sent` | `partially_paid` | `paid`.

  ## Responses
  - **200 OK** - an array of invoices: `[ { "id": number, "reseller_id": number, "status": "...", "total_amount_usd": number, "created_at": "...", "sent_at": "...|null", "paid_at": "...|null" } ]`.
  - **401 Unauthorized** - missing or invalid auth token.

  ## Notes
  Unlike `GET /api/invoices/:id/pdf` (which hides a draft's PDF from the reseller), this list endpoint is scoped by ownership only, not status - a reseller's own `draft` invoices still appear here, they just can't be downloaded as a PDF yet.
