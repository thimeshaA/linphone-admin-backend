order: 1003
params:
  - key: resellerId
    value: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
    disabled: true
    description: 'Admin-only filter: only invoices for this reseller'
description: |-
  ## Purpose
  Lists invoices - every invoice for admins, only the caller's own **sent** invoices for resellers.

  ## Use Case
  Powers the admin's billing dashboard (which needs to see unsent/in-progress invoices too) and the reseller's own "my invoices" view (which should only ever show them a finished statement, never a draft-in-progress one).

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admins** see every invoice, sent or not, optionally filtered by `resellerId`.
  - **Resellers** only ever see their own invoices, and only ones with `sent_at` set - an unsent invoice never appears in their list at all, same as it can't be fetched as a PDF (see `GET /api/invoices/:id/pdf`).
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **Optional query param:** `?resellerId=` - admin-only filter to one reseller's invoices.

  ## Responses
  - **200 OK** - an array of invoices: `[ { "id": number, "reseller_id": "uuid", "period_type": "monthly", "period_value": "2026-08", "total_amount_usd": number, "created_at": "...", "sent_at": "...|null" } ]`.
  - **401 Unauthorized** - missing or invalid auth token.

  ## Notes
  Unlike admins, a reseller's view is filtered by *both* ownership and `sent_at IS NOT NULL` - an invoice being generated is purely an admin-side action, and a reseller shouldn't be aware one exists until it's actually been sent to them.
