$kind: http-request
name: Record Invoice Payment
method: POST
url: '{{baseUrl}}/api/invoices/1/payment'
order: 1003
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amountPaid": 10,
      "note": "Bank transfer received"
    }
description: |-
  ## Purpose
  Records a manual payment against an invoice: credits the reseller's wallet and logs a `payment_received` ledger entry linked to this invoice.

  ## Use Case
  Called by the admin once a reseller pays outside the system (bank transfer, cash, etc.) against a specific invoice - distinct from `POST /api/resellers/:id/wallet/topup`, which isn't tied to any invoice.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admin-only** - resellers receive **403 Forbidden**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **URL param:** `:id` - the numeric id of the invoice.
  - **Required body field:** `amountPaid` (number) - must be a positive number.
  - **Optional body field:** `note` (string) - free-text note stored on the ledger entry.

  ## Responses
  - **200 OK** - the updated invoice, e.g. `{ "status": "partially_paid" | "paid", "paid_at": "..." | null, "...": "..." }`.
  - **400 Bad Request** - `amountPaid` is missing, not a number, or not positive.
  - **404 Not Found** - no invoice with that id.
  - **403 Forbidden** - caller is a reseller.
  - **401 Unauthorized** - missing or invalid auth token.

  ## Notes
  Status is derived live from the ledger, not a stored running total: every call sums *all* `payment_received` entries linked to this `invoice_id` and compares that sum to `total_amount_usd` - so multiple partial payments across separate calls are correctly summed, and `status` becomes `paid` (with `paid_at` set) the moment the cumulative total is reached or exceeded, `partially_paid` otherwise. A `payment_recorded` in-app notification is fired to the reseller on every call.
