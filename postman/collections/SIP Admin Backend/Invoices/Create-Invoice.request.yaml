$kind: http-request
name: Create Invoice
method: POST
url: '{{baseUrl}}/api/invoices'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "resellerId": "3fa85f64-5717-4562-b3fc-2c963f66afa6",
      "periodType": "monthly",
      "periodValue": "2026-08"
    }
description: |-
  ## Purpose
  Generates an invoice for a reseller covering one billing period - every `renewal_deduction` ledger entry for that reseller within the period is summed into the total and linked to the invoice.

  ## Use Case
  Called by the admin at the end of a billing cycle (e.g. the 1st of the month, for the month that just closed) to produce that period's statement.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admin-only** - resellers receive **403 Forbidden**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **Required body fields:**
    - `resellerId` (string, UUID) - must reference an existing reseller.
    - `periodType` (string) - `"monthly"` or `"annual"`.
    - `periodValue` (string) - `"YYYY-MM"` for a monthly period, `"YYYY"` for an annual one. Same format/validation as the `?month=`/`?year=` params on the account/reseller reports.

  ## Responses
  - **201 Created** - no invoice existed yet for this `resellerId` + `periodType` + `periodValue`; a new one was created: `{ "id": number, "reseller_id": "uuid", "period_type": "monthly", "period_value": "2026-08", "total_amount_usd": number, "created_at": "...", "sent_at": null }`.
  - **200 OK** - an invoice already existed for this exact `resellerId` + `periodType` + `periodValue`; it was **replaced** in place (same `id`) - see Notes. Same body shape as 201.
  - **400 Bad Request** - `periodType`/`periodValue` is missing or malformed, or `resellerId` doesn't reference an existing reseller.
  - **403 Forbidden** - caller is a reseller.
  - **401 Unauthorized** - missing or invalid auth token.

  ## Notes
  There is no status/payment state on an invoice (Phase 4, corrected) - it is a statement of what was owed for the period, not a payment tracker. Whether the reseller has paid is reflected only by whether admin has since credited their wallet via `POST /api/resellers/:id/wallet/topup`.

  Every ledger entry a **monthly** invoice claims is stamped `invoiced = true` and linked via `invoice_id`, so it can never be pulled into a second monthly invoice - each entry belongs to at most one monthly claim.

  **Annual invoices are a full-year rollup, not a claim on the remainder.** An annual invoice's `total_amount_usd` (and its PDF line items) always cover *every* `renewal_deduction` for that reseller in the calendar year, including months that already have their own monthly invoice - it does not skip or undercount those. Ledger entries already claimed by a monthly invoice are **not** reassigned to the annual invoice (they stay linked to that monthly invoice, so nothing is ever double-charged via `wallet_ledger`) - the annual document simply counts them in its total as a summary. Only entries still unclaimed at generation time get linked to the annual invoice itself.

  Regenerating the *exact same* reseller+period no longer returns 409 - it **replaces** the existing invoice instead (same `id`, no duplicate row):
  - **Monthly**: every ledger entry currently linked to it is released, the full set of unclaimed `renewal_deduction` entries for that reseller+period is regathered (the just-released entries plus any new renewals recorded since the last generation), and the total is recomputed from that full set.
  - **Annual**: the total is simply recomputed from the full year's entries again (including whatever's newly claimed by monthly invoices since, and any new renewals) - nothing needs releasing first, since the annual total was never claim-based.

  Either way, if the invoice had already been sent, `sent_at` is reset to `null` - a previously-emailed version no longer matches the recomputed content, so it reads as unsent again until an admin explicitly resends it via `POST /api/invoices/:id/send`.
