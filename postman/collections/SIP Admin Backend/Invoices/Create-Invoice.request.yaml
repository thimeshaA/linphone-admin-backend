$kind: http-request
name: Create Invoice
method: POST
url: '{{baseUrl}}/api/invoices'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "resellerId": 2,
      "ledgerEntryIds": [5, 6]
    }
description: |-
  ## Purpose
  Creates a draft invoice from a specific set of a reseller's uninvoiced `renewal_deduction` ledger entries.

  ## Use Case
  Called after the admin reviews `GET /api/resellers/:id/wallet/uninvoiced` and selects exactly what to bill this cycle.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admin-only** - resellers receive **403 Forbidden**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **Required body fields:**
    - `resellerId` (number) - must reference an existing reseller.
    - `ledgerEntryIds` (number[]) - non-empty; every id must be a `renewal_deduction` entry that belongs to `resellerId` and is not already invoiced.

  ## Responses
  - **201 Created** - the new invoice: `{ "id": number, "reseller_id": number, "status": "draft", "total_amount_usd": number, "created_at": "...", "sent_at": null, "paid_at": null }`.
  - **400 Bad Request** - `ledgerEntryIds` is missing/empty, `resellerId` doesn't reference an existing reseller, or any entry isn't an uninvoiced `renewal_deduction` belonging to that reseller (this also rejects re-billing an entry already linked to another invoice).
  - **403 Forbidden** - caller is a reseller.
  - **401 Unauthorized** - missing or invalid auth token.

  ## Notes
  `total_amount_usd` is the positive sum of the selected entries' absolute deduction amounts. On success, every selected ledger row is stamped `invoiced = true` and linked via `invoice_id` - they can never be selected into a second invoice. Nothing is emailed yet; use `POST /api/invoices/:id/send` for that.
