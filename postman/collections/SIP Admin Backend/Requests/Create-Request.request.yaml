$kind: http-request
name: Create Request
method: POST
url: '{{baseUrl}}/api/requests'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "type": "reseller",
      "requester_name": "Jane Doe",
      "requester_email": "jane.doe@example.com",
      "payload": {
        "company_name": "Doe Telecom",
        "phone": "+1234567890",
        "notes": "Interested in reselling in the EU region"
      }
    }
description: |-
  ## Purpose
  Submits a public request to become a reseller or to request an eSIM. Inserted into `requests` with `status: pending`.

  ## Use Case
  Called from a public-facing form (no login) when a visitor wants to become a reseller or request an eSIM.

  ## Authentication
  - **None** — this is the one public endpoint in the API.

  ## Request Requirements
  - **Required body fields:**
    - `type` (string) — must be `"reseller"` or `"esim"`.
    - `requester_email` (string) — the visitor's email address.
  - **Optional body fields:**
    - `requester_name` (string).
    - `payload` (object) — arbitrary type-specific details (company info for reseller requests, device/plan details for eSIM requests). Stored as-is in the `payload` JSON column.

  ## Responses
  - **201 Created** — request stored with `status: pending`.
  - **400 Bad Request** — `type` is missing/invalid, or `requester_email` is missing.

  ## Notes
  For an eSIM request, swap `"type": "reseller"` for `"type": "esim"` and adjust `payload` to whatever eSIM-specific fields the frontend form collects (e.g. device IMEI, plan, country). The `payload` shape is not validated server-side.
