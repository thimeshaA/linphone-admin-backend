$kind: http-request
name: Get Request By Id
method: GET
url: '{{baseUrl}}/api/requests/1'
order: 1002
description: |-
  ## Purpose
  Fetches a single request by its `id` from the `requests` table.

  ## Use Case
  Used when the admin needs to inspect the full details (including `payload`) of a specific request before approving or rejecting it.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admin-only** — resellers receive **403 Forbidden**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **URL param:** `:id` — the numeric id of the request to fetch.
  - No body or query params.

  ## Responses
  - **200 OK** — single request object.
  - **404 Not Found** — no request with that id exists.
  - **403 Forbidden** — caller is a reseller.
  - **401 Unauthorized** — missing or invalid auth token.
