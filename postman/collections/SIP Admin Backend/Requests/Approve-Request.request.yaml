$kind: http-request
name: Approve Request
method: PATCH
url: '{{baseUrl}}/api/requests/1/approve'
order: 1003
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "newreseller",
      "password": "securepassword"
    }
description: |-
  ## Purpose
  Approves a pending **reseller** request: creates a `reseller`-role account in `auth_admins`, emails the new credentials to the requester, and only then marks the request `approved`.

  ## Use Case
  Called by the admin after reviewing a reseller request's `payload` and deciding to onboard them.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admin-only** — resellers receive **403 Forbidden**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **URL param:** `:id` — the numeric id of the request to approve. Must have `type: reseller` and `status: pending`.
  - **Required body fields:**
    - `username` (string) — login username for the new reseller account.
    - `password` (string) — plaintext password; hashed server-side with bcrypt and emailed to the requester in plaintext.

  ## Responses
  - **200 OK** — reseller account created, credentials emailed, request marked `approved` with `reviewed_by`/`reviewed_at` set.
  - **400 Bad Request** — request is not `type: reseller`, request is not `pending`, or `username`/`password` missing.
  - **404 Not Found** — no request with that id exists.
  - **409 Conflict** — `username` already exists.
  - **500 Internal Server Error** — the reseller account was created, but sending the credentials email failed. The request is left `pending` (not `approved`) so the admin can retry.
  - **403 Forbidden** — caller is a reseller.
  - **401 Unauthorized** — missing or invalid auth token.

  ## Notes
  eSIM requests cannot be approved through this endpoint — use it only for `type: reseller` requests. If a `500` is returned, check SMTP configuration before retrying; retrying with the same username will now fail with `409` since the reseller account already exists — use a different username or resolve the reseller manually.
