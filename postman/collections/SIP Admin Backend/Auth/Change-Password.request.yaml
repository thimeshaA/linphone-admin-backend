$kind: http-request
name: Change Password
method: PATCH
url: '{{baseUrl}}/api/auth/change-password'
order: 3003
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "currentpassword",
      "newPassword": "newsecurepassword"
    }
description: |-
  ## Purpose
  Self-service password change for the currently logged-in user. Requires the current password to be confirmed before the new one is accepted, preventing unauthorized changes by someone who has access to an active session.

  ## Use Case
  Called when the admin or a reseller wants to update their own login password from within the app - for example, as part of a routine security rotation.

  ## Authentication
  - Requires a valid auth cookie (`verifyToken`).
  - Works for both the primary admin and any reseller - each user can only change their own password.
  - Returns **401** if the cookie is missing, invalid, or expired.

  ## Request Requirements
  - **Required body fields:**
    - `currentPassword` (string) - must match the existing bcrypt hash before the change is allowed.
    - `newPassword` (string) - new plaintext password; hashed server-side with bcrypt. Must be 10-128 characters and not on the local common-password blocklist - no forced complexity rules beyond that.
  - Rate-limited: max 3 attempts per hour per authenticated admin (in addition to needing a valid session).

  ## Responses
  - **200 OK** - password changed successfully. Returns only a success confirmation.
  - **400 Bad Request** - `currentPassword`/`newPassword` missing, or `newPassword` fails the password policy.
  - **401 Unauthorized** - `currentPassword` does not match the stored hash, or the auth cookie is invalid/expired.
  - **429 Too Many Requests** - rate limit exceeded.

  ## Notes
  This is a self-service endpoint - users can only change their own password. For admin-initiated password resets (where the reseller's current password is not required, but the acting admin's own current password now is), use the Admins → Reset Admin Password endpoint instead. On success, a "your password was changed" notification email is sent to the account's own address, and the change is written to the backend audit log.