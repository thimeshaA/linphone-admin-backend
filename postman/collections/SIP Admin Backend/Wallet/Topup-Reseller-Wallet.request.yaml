$kind: http-request
name: Top Up Reseller Wallet
method: POST
url: '{{baseUrl}}/api/resellers/3fa85f64-5717-4562-b3fc-2c963f66afa6/wallet/topup'
order: 1001
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": 50,
      "note": "Manual top-up"
    }
description: |-
  ## Purpose
  Credits a reseller's wallet balance and logs an `admin_topup` entry in `wallet_ledger`.

  ## Use Case
  Called by the admin when a reseller pays outside the system (bank transfer, cash, etc.) and needs their balance credited manually.

  ## Authentication
  - Requires login (`verifyToken` cookie must be present and valid).
  - **Admin-only** - resellers receive **403 Forbidden**.
  - Returns **401** if the auth cookie is missing, invalid, or expired.

  ## Request Requirements
  - **URL param:** `:id` - the UUID of the reseller to credit.
  - **Required body field:**
    - `amount` (number) - must be a positive number.
  - **Optional body field:**
    - `note` (string) - free-text note stored on the ledger entry.

  ## Responses
  - **200 OK** - `{ "resellerId": "uuid", "balanceUsd": number }` reflecting the new balance.
  - **400 Bad Request** - `amount` is missing, not a number, or not positive.
  - **404 Not Found** - no reseller with that id exists.
  - **403 Forbidden** - caller is a reseller.
  - **401 Unauthorized** - missing or invalid auth token.

  ## Notes
  The ledger entry's `created_by` is set to the acting admin's id. `amount_usd` is stored positive for top-ups (deductions are logged as negative `renewal_deduction` amounts).

  This is the *only* way a wallet balance increases (Phase 4, corrected) - a reseller paying an invoice outside the system is recorded the same way, as a top-up. Use `note` to record context (e.g. `"payment for August invoice"`) if useful; there is no separate payment-recording endpoint or ledger type.
